name: Build Debug APK

# Se lance à chaque push sur main, ou manuellement depuis l'onglet Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances (mode strict si les versions sont déjà figées)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Aligner les versions Expo (évite les modules désynchronisés)
        run: npx expo install --fix
        env:
          CI: 1

      - name: Figer les versions pour tous les prochains builds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- package.json package-lock.json; then
            git add package.json package-lock.json
            git commit -m "chore: figer les versions des dépendances (build reproductible)"
            git push
          else
            echo "Versions déjà figées, rien à committer."
          fi

      - name: Installer Java (requis pour Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Générer le projet Android natif
        run: npx expo prebuild --platform android --clean
        env:
          CI: 1

      - name: Builder l'APK debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publier l'APK comme artifact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: 6ieme-oeil-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
