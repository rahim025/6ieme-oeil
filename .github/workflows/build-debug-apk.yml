name: Build Debug APK (Gradle)

# Se lance à chaque push sur main, ou manuellement depuis l'onglet Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: |
          for i in 1 2 3; do
            npm install --no-audit --no-fund && break
            echo "Échec de npm install (tentative $i/3), nouvelle tentative dans 10s..."
            sleep 10
          done

      - name: Corriger les versions des modules Expo (compatibilité SDK)
        run: npx expo install --fix

      - name: Générer le projet Android natif
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: "1"

      - name: Compiler l'APK (Gradle)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a > ../gradle.log 2>&1

      - name: Publier l'APK comme artifact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: 6ieme-oeil-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Afficher l'erreur Gradle
        if: failure()
        run: |
          if [ -f gradle.log ]; then
            grep -n -A 30 "What went wrong" gradle.log | head -80
            echo "----- fin du log -----"
            tail -40 gradle.log
          fi
