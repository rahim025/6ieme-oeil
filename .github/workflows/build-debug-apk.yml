name: Build Debug APK

# Se lance à chaque push sur main, ou manuellement depuis l'onglet Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Installer Java (requis pour Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Générer le projet Android natif
        run: npx expo prebuild --platform android --non-interactive

      - name: Builder l'APK debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publier l'APK comme artifact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: 6ieme-oeil-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
